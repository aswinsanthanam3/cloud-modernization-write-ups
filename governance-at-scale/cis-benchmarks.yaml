# =============================================================================
# Compliance Control Mapping — CIS AWS Foundations Benchmark v5.0.0
# =============================================================================
#
# Reference:  ADR-2025-002 (Automated Security and Compliance Governance)
# Version:    2.0.0
# Date:       2026-03-15
# Author:     Aswin (Platform Engineering)
#
# CHANGES FROM v1.0.0:
#   - Added tier_applicability per control (production/development/sandbox/shared_services)
#   - Added scorecard thresholds per tier
#   - Added Security Hub central configuration policy mappings
#   - Scoped to NEW ACCOUNTS ONLY (vended via AFT)
#   - Controls not applicable to a tier are excluded from that tier's scorecard
#
# =============================================================================

framework:
  name: "CIS AWS Foundations Benchmark"
  version: "5.0.0"
  security_hub_standards_arn: "arn:aws:securityhub:::standards/cis-aws-foundations-benchmark/v/5.0.0"
  audit_manager_framework: "CIS AWS Foundations Benchmark v5.0"
  total_controls: 40

# =============================================================================
# Scoping Policy
# =============================================================================
scoping:
  applies_to: "new_accounts_only"
  enforcement_mechanism: "AFT account vending pipeline"
  description: >
    Controls, scorecard, and automated remediation apply ONLY to accounts
    vended through the AFT pipeline. Existing (brownfield) accounts are
    excluded from scoring and automated enforcement until explicitly
    enrolled in a future migration phase.
  aft_enforcement:
    global_customizations:
      - "Enable Security Hub with tier-specific central configuration policy"
      - "Enable AWS Config with organization recorder"
      - "Enable GuardDuty, Inspector, IAM Access Analyzer"
      - "Deploy mandatory tag policy"
      - "Enable EBS default encryption"
      - "Enable S3 Block Public Access (account level)"
      - "Delete default VPC"
      - "Deploy scorecard reporting Lambda"
    account_type_customizations:
      production: "Apply production Security Hub configuration policy"
      development: "Apply development Security Hub configuration policy"
      sandbox: "Apply sandbox Security Hub configuration policy"
      shared_services: "Apply shared_services Security Hub configuration policy"

# =============================================================================
# Scorecard Configuration
# =============================================================================
scorecard:
  metrics:
    - metric_id: "cis_compliance_pct"
      name: "CIS Compliance Score"
      source: "security_hub"
      description: >
        Percentage of PASSED controls out of total APPLICABLE controls
        for the account's tier. Controls marked not applicable to the
        tier are excluded from the denominator.
      calculation: "(passed_controls / applicable_controls) * 100"

    - metric_id: "tag_compliance_pct"
      name: "Tag Compliance Score"
      source: "config_rule"
      config_rule: "required-tags"
      description: >
        Percentage of taggable resources that have all mandatory tags
        present and conforming to enforced values.
      calculation: "(compliant_resources / total_taggable_resources) * 100"
      mandatory_tags:
        - key: "Environment"
          enforced_values: ["production", "development", "sandbox", "shared-services"]
        - key: "CostCenter"
          pattern: "^CC-\\d{6}$"
        - key: "Owner"
          pattern: "^[\\w.+-]+@[\\w-]+\\.[\\w.]+$"
        - key: "DataClassification"
          enforced_values: ["public", "internal", "confidential", "restricted"]

  thresholds:
    warning:
      cis_compliance_pct: 90
      tag_compliance_pct: 90
      action: "notify_owner"
      description: "Account owner receives Slack/email notification with finding details"
    critical:
      cis_compliance_pct: 80
      tag_compliance_pct: 80
      action: "notify_owner_and_escalate"
      description: "Account owner notified AND platform team receives escalation alert"
    escalation:
      cis_compliance_pct: 70
      tag_compliance_pct: 70
      action: "notify_owner_escalate_and_flag"
      description: >
        Account owner notified, platform team escalated, account flagged
        in governance dashboard for leadership review. Repeated breaches
        may trigger manual quarantine SCP attachment.

  notification:
    channels:
      - type: "sns"
        topic_name: "account-scorecard-alerts"
        subscribers: ["platform-team-email", "security-team-email"]
      - type: "slack"
        webhook_parameter: "/scorecard/slack-webhook-url"
        channel: "#cloud-governance"
    escalation_chain:
      warning: ["account_owner"]
      critical: ["account_owner", "platform_team"]
      escalation: ["account_owner", "platform_team", "engineering_leadership"]

  evaluation_schedule:
    frequency: "every_6_hours"
    eventbridge_rule: "scorecard-evaluation-schedule"
    description: >
      Lambda evaluates Security Hub compliance scores and Config tag
      compliance every 6 hours. Threshold breaches trigger immediate
      notification. Weekly summary report generated on Monday 08:00 UTC.
    weekly_summary:
      day: "monday"
      time_utc: "08:00"
      report_format: "html_email"
      includes: ["all_account_scores", "trend_7d", "top_failing_controls"]

# =============================================================================
# Security Hub Central Configuration Policies (per tier)
# =============================================================================
security_hub_policies:
  production:
    policy_name: "cis-production-full"
    description: "All 40 CIS v5.0 controls enabled — full Level 1 + Level 2"
    enabled_controls: "all"
    disabled_controls: []
    applicable_control_count: 40

  development:
    policy_name: "cis-development-standard"
    description: "Level 1 controls + select Level 2 (encryption, logging). Excludes HA and advanced monitoring."
    enabled_controls: "level_1_plus_select_level_2"
    disabled_controls:
      - "RDS.5"    # Multi-AZ instances — not required in dev
      - "RDS.15"   # Multi-AZ clusters — not required in dev
      - "S3.20"    # MFA delete — operational overhead in dev
      - "S3.22"    # S3 object-level write logging — cost prohibitive in dev
      - "S3.23"    # S3 object-level read logging — cost prohibitive in dev
      - "IAM.6"    # Hardware MFA for root — virtual MFA sufficient in dev
    applicable_control_count: 34

  sandbox:
    policy_name: "cis-sandbox-minimal"
    description: "Core security controls only — identity, encryption basics, network fundamentals."
    enabled_controls: "core_security_subset"
    disabled_controls:
      - "RDS.5"    # Multi-AZ instances
      - "RDS.15"   # Multi-AZ clusters
      - "RDS.13"   # Auto minor version upgrade
      - "S3.20"    # MFA delete
      - "S3.22"    # S3 object-level write logging
      - "S3.23"    # S3 object-level read logging
      - "IAM.6"    # Hardware MFA for root
      - "IAM.3"    # Access key rotation — sandbox accounts are ephemeral
      - "IAM.22"   # Unused credentials — sandbox accounts are ephemeral
      - "IAM.26"   # Expired SSL certs
      - "EFS.1"    # EFS KMS encryption
      - "EFS.8"    # EFS encryption at rest
      - "EC2.2"    # Default SG closed — sandbox allows experimentation
      - "CloudTrail.2"  # CloudTrail KMS encryption — org trail covers this
      - "CloudTrail.4"  # Log file validation — org trail covers this
      - "CloudTrail.7"  # CloudTrail S3 bucket logging — org trail covers this
    applicable_control_count: 24

  shared_services:
    policy_name: "cis-shared-services-full"
    description: "All 40 CIS v5.0 controls enabled — infrastructure accounts need full coverage."
    enabled_controls: "all"
    disabled_controls: []
    applicable_control_count: 40

